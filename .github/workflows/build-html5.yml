name: Build and Deploy Sonic.EXE HTML5

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe 4.1.5
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.1.5

      - name: Install legacy libffi6 for Lime 7.9.0
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q https://archive.ubuntu.com/ubuntu/pool/main/libf/libffi/libffi6_3.2.1-8_amd64.deb -O /tmp/libffi6.deb
          sudo dpkg -i /tmp/libffi6.deb
          sudo ldconfig

      - name: Install Kade Engine dependencies
        shell: bash
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 7.9.0
          haxelib install openfl 9.1.0
          haxelib install flixel 4.11.0
          haxelib install flixel-tools 1.5.1
          haxelib install flixel-addons 2.11.0
          haxelib install flixel-ui 2.4.0
          haxelib install hscript 2.3.0
          haxelib install actuate 1.9.0
          haxelib install newgrounds 1.1.5
          # The Kade HTML5 build does not need flixel-tools' interactive setup.
          # Lime setup is run non-interactively below.
          haxelib run lime setup -y
          # Re-assert the Kade-era versions after dependency resolution.
          haxelib set lime 7.9.0
          haxelib set openfl 9.1.0
          haxelib set flixel 4.11.0
          haxelib set flixel-tools 1.5.1
          haxelib set flixel-addons 2.11.0
          haxelib set flixel-ui 2.4.0
          haxelib set hscript 2.3.0
          haxelib set actuate 1.9.0
          haxelib set newgrounds 1.1.5

      - name: Build HTML5
        run: haxelib run lime build html5 -release -v -D disable_preloader_assets

      - name: Inspect generated HTML5 startup files
        shell: bash
        run: |
          echo "=== Largest generated files ==="
          find export/release/html5/bin -type f -printf '%s %p\n' | sort -nr | head -30 || true
          echo "=== Preloader define check ==="
          if grep -R "disable_preloader_assets" export/release/html5/haxe 2>/dev/null; then
            echo "disable_preloader_assets appears in generated Haxe sources"
          else
            echo "disable_preloader_assets is not present as literal generated source (likely preprocessed)"
          fi
          true

      - name: Verify HTML5 output
        shell: bash
        run: |
          test -s export/release/html5/bin/index.html
          echo "HTML5 entry point verified: export/release/html5/bin/index.html"

      - name: Add GitHub Pages marker
        run: touch export/release/html5/bin/.nojekyll

      - name: Upload playable HTML5 build
        uses: actions/upload-artifact@v4
        with:
          name: sonic-exe-html5
          path: export/release/html5/bin

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: export/release/html5/bin

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
